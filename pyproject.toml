[project]
name = "deemo-attack25-bot"
version = "0.1.0"
description = "DEEMO x Attack25 style quiz Discord bot"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.4",
    "pillow>=12.2.0",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
